name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Canary - fail post-merge CI while marker exists
        if: ${{ github.event_name == 'push' && hashFiles('.github/vercel-deployment-check-canary-fail') != '' }}
        run: |
          echo "::error::Intentional Vercel Deployment Checks canary failure."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nextjs/package-lock.json

      - name: Install dependencies
        working-directory: nextjs
        run: npm ci

      - name: Run targeted regression tests
        working-directory: nextjs
        run: |
          set -euo pipefail
          shopt -s nullglob
          test_files=(scripts/phase*-test-*.mjs)
          if (( ${#test_files[@]} == 0 )); then
            echo "::error::No targeted phase regression tests found."
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            echo "Running $test_file..."
            node "$test_file"
          done
          echo "All targeted tests passed."

      - name: Build
        working-directory: nextjs
        run: npm run build
